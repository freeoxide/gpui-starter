[package]
name = "gpui-auth"
version = "0.1.0"
edition = "2024"
publish = false
description = "Auth foundation for GPUI apps: token model, PKCE, provider trait, controller entity"
license = "MIT"

[features]
mock-provider = []

[dependencies]
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
thiserror = "2"
url = "2.5"
base64 = "0.22"
sha2 = "0.10"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = { version = "0.4", features = ["std", "wasm_js"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.9", features = ["test-support"] }
