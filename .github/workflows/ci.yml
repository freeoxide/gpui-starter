name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# CI env for the gpui-pre (crates.io snapshot of Zed gpui) + gpui-kit (crate
# gpui-component) + gpui-form graph.
# These knobs are peak-RSS / target/-hygiene for the 14 GB runner (not
# correctness needs):
#   - CARGO_BUILD_JOBS=2, *_CODEGEN_UNITS=256, *_DEBUG=none, CARGO_INCREMENTAL=0.
# NOTE: the previous RUST_MIN_STACK=512 MiB + recursion_limit=8192 were a band-aid
# over a `#[test]` → `gpui::test` glob-shadow that recursed infinitely and
# overflowed rustc's stack (SIGBUS/SIGSEGV). That shadow is fixed at the
# test-module call sites (see src/lib.rs), so neither knob is needed or set.
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
  CARGO_PROFILE_DEV_DEBUG: none
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "256"
  CARGO_PROFILE_TEST_DEBUG: none
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-macos"
          # PR runs RESTORE the base (master) cache — that half is default
          # GitHub behavior — but never save: PR-scoped entries are visible
          # only to that one PR and were what kept filling the 10 GB cache
          # quota. Master-only saves keep exactly one warm line of caches.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cargo check (dev)
        run: cargo check

      # `cargo check` uses the DEV profile (debug_assertions on), so it is blind
      # to any code behind `#[cfg(not(debug_assertions))]`. That class of debug/
      # release divergence once shipped green here and then broke the release
      # build. This release-profile check is still metadata-only (no codegen), so
      # it adds only a few minutes and catches release-only cfg code in the fast
      # lane — mirroring what `cargo build --release` will actually compile.
      - name: Cargo check (release)
        run: cargo check --release

  # ---------------------------------------------------------------------
  # NOTE: there is no WORKSPACE-WIDE `cargo test` job here. A full `cargo test`
  # does codegen of the entire gpui-pre + gpui-kit + gpui-form graph
  # (~13 GB of target/), which on the macOS runner is a multi-HOUR build that
  # exceeds GitHub's 6 h job limit. There is no fast subset either: every
  # crate's tests — even gpui-query's no-gpui `core` feature — import gpui's
  # `TestAppContext`, so they all require compiling the whole gpui stack from
  # source (crates.io sources, not precompiled).
  #
  # Coverage is not lost for the "does it build?" question: the `check` job
  # type-checks AND macro-expands the WHOLE codebase (forms included) in ~8
  # min. For runtime correctness we run the SCOPED `test` job below
  # (`cargo test -p gpui-starter --lib`), which compiles only this crate's
  # pure unit tests (no gpui TestAppContext, no live D-Bus) and passes clean.
  # ---------------------------------------------------------------------

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-macos"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run clippy
        run: cargo clippy -- -D warnings

  fmt:
    name: Formatting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # ---------------------------------------------------------------------
  # Linux lane: compiles the cfg(target_os = "linux")-gated code paths
  # (notifications backends, window setup) that the macOS-primary lane
  # never sees. Same scoped-`test` policy, same codegen discipline.
  # Runners pinned to ubuntu-24.04: ubuntu-latest flips to Ubuntu 26 on
  # 2026-10-19 (actions/runner-images#14748), which would change system
  # deps under us mid-quarter.
  # ---------------------------------------------------------------------
  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the Linux target cache fully separate from the macOS lane:
          # the gpui (gpui-pre) dependency is compiled with different cfg
          # flags (x11/wayland) and a shared key would be poisoned across
          # runners.
          prefix-key: "v2-linux"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cargo check (dev)
        run: cargo check

      - name: Cargo check (release)
        run: cargo check --release

  clippy-linux:
    name: Clippy (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-linux"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run clippy
        run: cargo clippy -- -D warnings

  # ---------------------------------------------------------------------
  # Windows lane: compiles the cfg(target_os = "windows")-gated code paths
  # (user-notify backend, win32 single-instance IPC) that the macOS/Linux
  # lanes never see. windows-latest ships VS 2022 + the full Windows SDK,
  # so no setup step is needed. The default pwsh shell is load-bearing:
  # a `shell: bash` step puts Git Bash's /usr/bin/link.exe (coreutils) on
  # PATH ahead of MSVC's linker and every link fails — the same shadowing
  # scripts/windows-dev-env.sh works around for no-SDK dev machines.
  # ---------------------------------------------------------------------
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    env:
      # The default C:\Users\runneradmin\.cargo prefix puts gpui-form's longest
      # checkout path at 266 chars (MAX_PATH is 260); C:\cargo caps it at 247.
      CARGO_HOME: 'C:\cargo'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-windows"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cargo check (dev)
        run: cargo check

      - name: Cargo check (release)
        run: cargo check --release

  # ---------------------------------------------------------------------
  # Scoped lib tests (Linux). The FULL `cargo test` workspace build is multi-
  # hour (every crate's tests pull gpui's TestAppContext) and not viable in CI,
  # but `cargo test -p gpui-starter --lib` compiles ONLY this crate's lib test
  # target — pure unit tests (no gpui TestAppContext, no live D-Bus) — which
  # sccache + a dedicated rust-cache key keep fast on repeat runs. Binding now
  # that the glob-shadow stack overflow is fixed (231 lib tests pass clean).
  # ---------------------------------------------------------------------
  test:
    name: Test (lib, Linux)
    runs-on: ubuntu-24.04
    # Full codegen of the gpui dependency graph. A warm rust-cache + sccache
    # keeps this well under 30 min, but ANY Cargo.lock change (dep bump, new
    # pin) invalidates the key and the cold rebuild needs 60-100+ min at
    # CARGO_BUILD_JOBS=2 — the original 30-min cap killed exactly that run
    # (PR #6's first attempt: cancelled at 30m17s with rustc mid-compile).
    timeout-minutes: 120
    env:
      # RUSTC_WRAPPER must stay identical on master and PR runs: cargo mixes
      # the wrapper into its build fingerprints, so flipping it per-event
      # would invalidate the target/ dir restored from the master rust-cache.
      RUSTC_WRAPPER: sccache
      # SCCACHE_GHA_ENABLED is what persists sccache hits across runs — the
      # sccache-action only installs the binary (it does NOT set this itself;
      # before this was set, sccache silently used a throwaway per-run disk
      # cache and cached nothing). Backend writes are master-only so PR runs
      # never create cache entries; PR speed comes from the restored target/
      # dir instead. Reads on PRs would work (base-branch scope) but every
      # compile miss would be written back as PR-scoped quota junk.
      SCCACHE_GHA_ENABLED: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          # Dedicated key: the test profile produces different artifacts than
          # check/clippy — a shared key would poison across jobs (cf. aaa591d).
          prefix-key: "v2-linux-test"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # Save even when tests fail: the cold rebuild noted above
          # (60-100+ min after any Cargo.lock change) shouldn't restart from
          # zero because one test flaked mid-run.
          cache-on-failure: true

      - name: Run scoped lib tests
        run: cargo test -p gpui-starter --lib

  # ---------------------------------------------------------------------
  # Scoped lib tests (Windows) — same policy as the Linux test lane; also
  # the only lane that exercises the MSVC LINKER on a runner (test binaries
  # are linked even though `cargo check` never links). Default pwsh shell,
  # never `shell: bash` (see the check-windows note on link.exe shadowing).
  # ---------------------------------------------------------------------
  test-windows:
    name: Test (lib, Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Same wrapper/fingerprint discipline as the Linux test lane.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}
      # Short CARGO_HOME: same gpui-form MAX_PATH fix as check-windows.
      CARGO_HOME: 'C:\cargo'
      # sccache expands cargo's @response-file when respawning rustc; C:\t keeps
      # the line ~22k chars, under CreateProcessW's 32767 cap (mozilla/sccache#2397).
      CARGO_TARGET_DIR: 'C:\t'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-windows-test"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
          # v2 does not read CARGO_TARGET_DIR; cache-directories points the
          # cache at C:\t instead of the now-unused <workspace>\target. Not
          # `workspaces`: its C:\ root makes the key glob the whole drive
          # (6m walk + EPERM annotation) and runs cargo metadata off-repo.
          cache-directories: 'C:\t'

      - name: Run scoped lib tests
        run: cargo test -p gpui-starter --lib
