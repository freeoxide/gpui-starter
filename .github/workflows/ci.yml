name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# CI env for the gpui-pre (crates.io snapshot of Zed gpui) + gpui-kit (crate
# gpui-component) + gpui-form graph.
# These knobs are peak-RSS / target/-hygiene for the 14 GB runner (not
# correctness needs):
#   - CARGO_BUILD_JOBS=2, *_CODEGEN_UNITS=256, *_DEBUG=none, CARGO_INCREMENTAL=0.
# NOTE: the previous RUST_MIN_STACK=512 MiB + recursion_limit=8192 were a band-aid
# over a `#[test]` → `gpui::test` glob-shadow that recursed infinitely and
# overflowed rustc's stack (SIGBUS/SIGSEGV). That shadow is fixed at the
# test-module call sites (see src/lib.rs), so neither knob is needed or set.
env:
  # One pinned nightly, reused by every job (dtolnay/rust-toolchain input):
  # a floating nightly lets an upstream rustc regression fail unrelated PRs
  # and makes runs irreproducible. Bump deliberately, with the local toolchain.
  RUST_TOOLCHAIN: nightly-2026-08-16
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
  CARGO_PROFILE_DEV_DEBUG: none
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "256"
  CARGO_PROFILE_TEST_DEBUG: none
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-macos"
          # PR runs RESTORE the base (master) cache — that half is default
          # GitHub behavior — but never save: PR-scoped entries are visible
          # only to that one PR and were what kept filling the 10 GB cache
          # quota. Master-only saves keep exactly one warm line of caches.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Same command as the AGENTS.md gate: --workspace --all-features also
      # type-checks the feature-gated code (otlp/ai-chat/devtools/artifact)
      # and the collab-server crate the default-feature build never selects.
      - name: Cargo check (dev)
        run: cargo check --workspace --all-features --locked

      # `cargo check` uses the DEV profile (debug_assertions on), so it is blind
      # to any code behind `#[cfg(not(debug_assertions))]`. That class of debug/
      # release divergence once shipped green here and then broke the release
      # build. This release-profile check is still metadata-only (no codegen), so
      # it adds only a few minutes and catches release-only cfg code in the fast
      # lane — mirroring what `cargo build --release` will actually compile.
      - name: Cargo check (release)
        run: cargo check --release --workspace --all-features --locked

  # ---------------------------------------------------------------------
  # NOTE: there is no WORKSPACE-WIDE `cargo test` job here. A full `cargo test`
  # does codegen of the entire gpui-pre + gpui-kit + gpui-form graph
  # (~13 GB of target/), which on the macOS runner is a multi-HOUR build that
  # exceeds GitHub's 6 h job limit. There is no fast subset either: every
  # crate's tests — even gpui-query's no-gpui `core` feature — import gpui's
  # `TestAppContext`, so they all require compiling the whole gpui stack from
  # source (crates.io sources, not precompiled).
  #
  # Coverage is not lost for the "does it build?" question: the `check` job
  # type-checks AND macro-expands the WHOLE codebase (forms included) in ~8
  # min. For runtime correctness we run the SCOPED `test` job below: this
  # crate's lib + tests/ targets (no gpui TestAppContext, no live D-Bus) plus
  # the small workspace crates. The dev-dep graph — gpui test-support
  # included — builds once per crate, so that widening costs linking extra
  # test binaries, not new dependency codegen.
  # ---------------------------------------------------------------------

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-macos"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The AGENTS.md gate verbatim; CI must reject what `just clippy` rejects.
      - name: Run clippy
        run: cargo clippy --workspace --all-features --locked -- -D warnings

  fmt:
    name: Formatting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # ---------------------------------------------------------------------
  # Linux lane: compiles the cfg(target_os = "linux")-gated code paths
  # (notifications backends, window setup) that the macOS-primary lane
  # never sees. Same scoped-`test` policy, same codegen discipline.
  # Runners pinned to ubuntu-24.04: ubuntu-latest flips to Ubuntu 26 on
  # 2026-10-19 (actions/runner-images#14748), which would change system
  # deps under us mid-quarter.
  # ---------------------------------------------------------------------
  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the Linux target cache fully separate from the macOS lane:
          # the gpui (gpui-pre) dependency is compiled with different cfg
          # flags (x11/wayland) and a shared key would be poisoned across
          # runners.
          prefix-key: "v2-linux"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cargo check (dev)
        run: cargo check --workspace --all-features --locked

      - name: Cargo check (release)
        run: cargo check --release --workspace --all-features --locked

  clippy-linux:
    name: Clippy (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-linux"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run clippy
        run: cargo clippy --workspace --all-features --locked -- -D warnings

  # ---------------------------------------------------------------------
  # Wasm lane: wasm32-unknown-unknown is a shipped target (the wasm/ web
  # harness), so it gates here instead of only via local `just wasm-check`.
  # Same command as the justfile recipe; nightly is required (wasm_thread
  # uses stdarch_wasm_atomic_wait). No wasm-bindgen CLI: `cargo check`
  # never post-processes a .wasm — only wasm/build.sh needs it.
  # ---------------------------------------------------------------------
  check-wasm:
    name: Check (wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate key: the wasm target dir holds a different dependency
          # set than the native Linux lanes.
          prefix-key: "v2-linux-wasm"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cargo check (wasm)
        run: cargo check --locked --target wasm32-unknown-unknown -p gpui-starter --lib

  # ---------------------------------------------------------------------
  # Windows lane: compiles the cfg(target_os = "windows")-gated code paths
  # (user-notify backend, win32 single-instance IPC) that the macOS/Linux
  # lanes never see. windows-latest ships VS 2022 + the full Windows SDK,
  # so no setup step is needed. The default pwsh shell is load-bearing:
  # a `shell: bash` step puts Git Bash's /usr/bin/link.exe (coreutils) on
  # PATH ahead of MSVC's linker and every link fails — the same shadowing
  # scripts/windows-dev-env.sh works around for no-SDK dev machines.
  # ---------------------------------------------------------------------
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    env:
      # The default C:\Users\runneradmin\.cargo prefix puts gpui-form's longest
      # checkout path at 266 chars (MAX_PATH is 260); C:\cargo caps it at 247.
      CARGO_HOME: 'C:\cargo'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-windows"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cargo check (dev)
        run: cargo check --workspace --all-features --locked

      - name: Cargo check (release)
        run: cargo check --release --workspace --all-features --locked

  # ---------------------------------------------------------------------
  # Scoped tests (Linux). The FULL `cargo test` workspace build is multi-
  # hour (every crate's tests pull gpui's TestAppContext) and not viable in
  # CI, so this lane runs this crate's lib + tests/ targets (pure tests: no
  # gpui TestAppContext, no live D-Bus; only qa_migration spawns `git`) plus
  # the small workspace crates — collab-protocol is serde-only and
  # collab-server has no gpui at all. Kache + a dedicated rust-cache key
  # keep repeat runs fast.
  # ---------------------------------------------------------------------
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    # Full codegen of the gpui dependency graph. A warm rust-cache + kache
    # keeps this well under 30 min, but ANY Cargo.lock change (dep bump, new
    # pin) invalidates the key and the cold rebuild needs 60-100+ min at
    # CARGO_BUILD_JOBS=2 — the original 30-min cap killed exactly that run
    # (PR #6's first attempt: cancelled at 30m17s with rustc mid-compile).
    timeout-minutes: 120
    env:
      # Same fingerprint rule as the sccache era, now guaranteed by kache:
      # RUSTC_WRAPPER must stay identical on master and PR runs (cargo mixes
      # the wrapper into its build fingerprints), so it is pinned here and by
      # kache-action — never per-event. Persistence goes through kache-action
      # and the GitHub cache service; kache forces PR runs read-only, so PR
      # speed comes from the restored target/ dir without PR-scoped cache
      # quota junk (the manual master-only gate sccache needed).
      RUSTC_WRAPPER: kache
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: kunobi-ninja/kache-action@v1

      - uses: Swatinem/rust-cache@v2
        with:
          # Dedicated key: the test profile produces different artifacts than
          # check/clippy — a shared key would poison across jobs (cf. aaa591d).
          prefix-key: "v2-linux-test"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # Save even when tests fail: the cold rebuild noted above
          # (60-100+ min after any Cargo.lock change) shouldn't restart from
          # zero because one test flaked mid-run.
          cache-on-failure: true

      - name: Run scoped tests
        # The tests/ binaries spawn only `git` (qa_migration.rs), so they are
        # link-time-only on top of the lib lane's dependency build.
        run: cargo test -p gpui-starter --tests --locked

      - name: Run workspace crate tests
        run: cargo test -p gpui-auth -p collab-protocol -p collab-server --locked

  # ---------------------------------------------------------------------
  # Scoped lib tests (Windows) — narrower than the Linux test lane; also
  # the only lane that exercises the MSVC LINKER on a runner (test binaries
  # are linked even though `cargo check` never links). Default pwsh shell,
  # never `shell: bash` (see the check-windows note on link.exe shadowing).
  # ---------------------------------------------------------------------
  test-windows:
    name: Test (lib, Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Same wrapper/fingerprint discipline as the Linux test lane.
      RUSTC_WRAPPER: kache
      # Short CARGO_HOME: same gpui-form MAX_PATH fix as check-windows.
      CARGO_HOME: 'C:\cargo'
      # C:\t keeps target-dir paths short for the same MAX_PATH reason; the
      # @response-file length cap it also served was sccache-specific.
      CARGO_TARGET_DIR: 'C:\t'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: kunobi-ninja/kache-action@v1

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-windows-test"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
          # v2 does not read CARGO_TARGET_DIR; cache-directories points the
          # cache at C:\t instead of the now-unused <workspace>\target. Not
          # `workspaces`: its C:\ root makes the key glob the whole drive
          # (6m walk + EPERM annotation) and runs cargo metadata off-repo.
          cache-directories: 'C:\t'

      - name: Run scoped lib tests
        run: cargo test -p gpui-starter --lib --locked

  # ---------------------------------------------------------------------
  # Scoped lib tests (macOS), mirroring the Windows lib lane. This is the
  # only lane that compiles and runs the macOS-gated cfg(test) code
  # (tray/macos.test.rs): the check/clippy jobs pass no --tests/--all-targets,
  # so without this lane even a compile error there would ship green.
  # No kache (no macOS job here uses it); rust-cache alone warms the target
  # dir, and the 120-min cap matches the other full-codegen test lanes.
  # ---------------------------------------------------------------------
  test-macos:
    name: Test (lib, macOS)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Dedicated key: the test profile produces different artifacts than
          # check/clippy (cf. the Linux test lane note).
          prefix-key: "v2-macos-test"
          # Master-only saves; PRs restore only (see the check job note).
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Run scoped lib tests
        run: cargo test -p gpui-starter --lib --locked
