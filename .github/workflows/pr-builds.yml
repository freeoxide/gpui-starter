name: PR Builds

# Runnable debug binaries as PR-check artifacts, so UI work (e.g. the
# example gallery) can be tested from the Checks page without a local
# cargo build. Quality gates stay in ci.yml; release distributions stay
# in release.yml — this file only produces throwaway test builds. The
# artifact feature embeds assets that debug rust-embed would otherwise
# read from this runner's fs (missing on the download machine).
#
# Master pushes reuse the same lanes to keep the rust-cache lines warm AND
# republish the rolling `latest` release (see publish-latest): one release,
# stable asset names, replaced on every push so it always holds the newest
# master build — whether that arrived as a merge or a direct commit.
on:
  pull_request:
    branches: [master]
  # Master pushes do NOT upload; they exist to keep the rust-cache lines
  # warm that PR runs restore (same quota discipline as ci.yml: saves are
  # master-only, exactly one warm line per lane).
  push:
    branches: [master]

# contents:write covers the publish-latest release upsert; PR runs never
# publish (every publish step is push-gated), and fork PR tokens are
# read-only regardless.
permissions:
  contents: write

# Cancel a superseded run when the same PR is pushed to again mid-build —
# these lanes are long enough that stale runs are pure waste.
concurrency:
  group: pr-builds-${{ github.ref }}
  cancel-in-progress: true

# Same env discipline as ci.yml (peak-RSS / target-hygiene knobs for the
# 14 GB runners; see the long note there). Dev profile: this is a test
# build, not a distribution — release-only cfg divergence is already
# caught by the release-profile `cargo check` in ci.yml.
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
  CARGO_PROFILE_DEV_DEBUG: none
  RUST_BACKTRACE: "1"
  # Pinned here and by kache-action on every run (master and PR alike):
  # cargo mixes the wrapper into its build fingerprints, so it must never
  # differ per-event. kache complements rust-cache with compile-level hits
  # that cross profile boundaries (dev/test/release share rustc outputs).
  RUSTC_WRAPPER: kache
  # GPUI_UPDATE_MANIFEST_URL is deliberately unset: option_env! in
  # src/services/updater/types.rs disables the updater when absent, so a
  # test build never checks the published manifest.

jobs:
  # ---------------------------------------------------------------------
  # Linux x86_64: raw binary + $ORIGIN/lib rpath + bundled non-system
  # .so files (trimmed from the release.yml bundling step). Without the
  # rpath/bundle a Linux artifact fails to start on any machine lacking
  # the exact system libs — a test build that won't launch is worse than
  # none. Runners pinned to ubuntu-24.04 for the same reason as ci.yml
  # (ubuntu-latest flips to Ubuntu 26 on 2026-10-19).
  # ---------------------------------------------------------------------
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly

      - uses: kunobi-ninja/kache-action@v1

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-linux-prbuild"
          # Master-only saves; PRs restore only (see ci.yml check job).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build debug binary
        # --features artifact: the binary leaves this runner, and rust-embed
        # only embeds at compile time in release or with debug-embed.
        run: cargo build --features artifact

      - name: Relink rpath and bundle shared libraries
        run: |
          set -euo pipefail
          STAGE="stage/gpui-starter"
          mkdir -p "$STAGE/lib" stage
          cp "target/debug/gpui-starter" "$STAGE/gpui-starter"
          patchelf --set-rpath '$ORIGIN/lib' "$STAGE/gpui-starter"
          # Bundle the non-system shared libs the binary needs; glibc /
          # ld-linux stay on the system (bundling those breaks across
          # glibc versions).
          for lib in $(ldd "$STAGE/gpui-starter" | awk '/=> \// {print $3}'); do
            base="$(basename "$lib")"
            case "$base" in
              libc.so*|libm.so*|libdl.so*|librt.so*|libpthread.so*|ld-linux*|libgcc_s.so*|libutil.so*|libresolv.so*)
                continue
                ;;
            esac
            [ -f "$STAGE/lib/$base" ] || cp -L "$lib" "$STAGE/lib/"
          done
          # GITHUB_SHA on a PR event is the merge commit, so this labels
          # exactly the combination the artifact was tested as.
          tar -czf "stage/gpui-starter-${GITHUB_SHA:0:12}-linux-x86_64-debug.tar.gz" -C stage gpui-starter

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpui-starter-linux-x86_64-debug
          path: stage/*.tar.gz
          if-no-files-found: error

      # GitHub attaches artifacts to the workflow RUN, never to the job
      # page people land on — so each lane's summary carries the direct
      # link plus what is inside the archive.
      - name: Link the artifact from this job's summary
        if: github.event_name == 'pull_request'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Download this build"
            echo "Artifacts live on the run page, not on this job page: $RUN_URL"
            echo "Artifact: gpui-starter-linux-x86_64-debug — tarball with the binary plus bundled libs; run ./gpui-starter/gpui-starter."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Windows x64: the linked .exe alone. MSVC's runtime (vcruntime) is
  # dynamically linked and expected on the test machine (standard VC++
  # redist). Default pwsh shell, never `shell: bash` — see the
  # check-windows note in ci.yml on Git Bash link.exe shadowing.
  # ---------------------------------------------------------------------
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      # Same CARGO_HOME / CARGO_TARGET_DIR quirks as the ci.yml Windows
      # lanes (gpui-form MAX_PATH: 266 > 260).
      CARGO_HOME: 'C:\cargo'
      CARGO_TARGET_DIR: 'C:\t'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: kunobi-ninja/kache-action@v1

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-windows-prbuild"
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # v2 does not read CARGO_TARGET_DIR; point the cache at C:\t
          # (same reasoning as the test-windows lane in ci.yml).
          cache-directories: 'C:\t'

      - name: Build debug binary
        # --features artifact: the binary leaves this runner, and rust-embed
        # only embeds at compile time in release or with debug-embed.
        run: cargo build --features artifact

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpui-starter-windows-x64-debug
          path: 'C:\t\debug\gpui-starter.exe'
          if-no-files-found: error

      - name: Link the artifact from this job's summary
        if: github.event_name == 'pull_request'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "### Download this build" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "Artifacts live on the run page, not on this job page: $env:RUN_URL" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "Artifact: gpui-starter-windows-x64-debug - gpui-starter.exe (x64, debug; needs the VC++ runtime)." | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------
  # macOS (host arch, arm64 on macos-latest): plain binary, no .app
  # bundle / codesign / DMG — those are release.yml's job. Ad-hoc
  # signature is applied by the linker, so macOS Gatekeeper may still
  # ask on first launch; right-click > Open accepts it for a test build.
  # ---------------------------------------------------------------------
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: kunobi-ninja/kache-action@v1

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-macos-prbuild"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build debug binary
        # --features artifact: the binary leaves this runner, and rust-embed
        # only embeds at compile time in release or with debug-embed.
        run: cargo build --features artifact

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpui-starter-macos-arm64-debug
          path: target/debug/gpui-starter
          if-no-files-found: error

      - name: Link the artifact from this job's summary
        if: github.event_name == 'pull_request'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Download this build"
            echo "Artifacts live on the run page, not on this job page: $RUN_URL"
            echo "Artifact: gpui-starter-macos-arm64-debug — bare arm64 binary (chmod +x before running; unsigned test build)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Rolling `latest` release: every master push replaces the assets of the
  # single `latest` release, so it always holds the newest master build
  # (merge or direct commit — both land as pushes). Stable asset names are
  # what make replacement work: softprops swaps same-named files, while a
  # sha-per-file name would only accumulate. The tag moves to the built
  # commit first, so the release always points at what it ships.
  # ---------------------------------------------------------------------
  publish-latest:
    name: Publish latest builds
    if: github.event_name == 'push'
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gpui-starter-*-debug
          merge-multiple: true
          path: ./artifacts

      - name: Stage stable-named release files
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/gpui-starter-*-linux-x86_64-debug.tar.gz \
            release/gpui-starter-linux-x86_64-debug.tar.gz
          cp artifacts/gpui-starter.exe \
            release/gpui-starter-windows-x64-debug.exe
          cp artifacts/gpui-starter \
            release/gpui-starter-macos-arm64-debug

      - name: Move the latest tag to this build
        run: |
          # Runners have no git ident configured; tag creation hard-fails
          # without one (release.yml sets the same identity for gh-pages).
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
            tag -fa latest -m "Rolling latest master build" "${GITHUB_SHA}"
          git push -f origin "refs/tags/latest"

      - name: Upsert the latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest master builds
          prerelease: true
          body: |
            Rolling build of master @ ${{ github.sha }}.
            Assets are replaced on every push to master — always the newest build.
          files: |
            release/gpui-starter-linux-x86_64-debug.tar.gz
            release/gpui-starter-windows-x64-debug.exe
            release/gpui-starter-macos-arm64-debug
