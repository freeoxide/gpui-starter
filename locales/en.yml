error_playground_title: "Error Boundary Playground"
error_playground_intro: "Test different failure modes. Red-bordered cards activate the error boundary via action dispatch (a real render panic is process-fatal in GPUI, so the recovery flow is simulated without crashing). Green-bordered cards handle errors gracefully inline."
error_playground_render_error_title: "Simulated Render Error"
error_playground_render_error_description: "Dispatches TriggerRenderError to activate the error boundary directly. The fallback page appears with a summary and Reload button."
error_playground_render_error_button: "Trigger Render Error"
error_playground_div_zero_title: "Simulated Division by Zero"
error_playground_div_zero_description: "Activates the error boundary as if a division-by-zero occurred during render."
error_playground_div_zero_button: "Trigger Div Zero Error"
error_playground_oob_title: "Simulated Index Out of Bounds"
error_playground_oob_description: "Activates the error boundary as if an out-of-bounds access occurred during render."
error_playground_oob_button: "Trigger OOB Error"
error_playground_bg_panic_title: "Background Task Panic"
error_playground_bg_panic_description: "Spawns an async task on the tokio runtime that panics. Should NOT trigger the error boundary (only render-path panics are caught by the thread-local guard)."
error_playground_bg_panic_button: "Spawn Background Panic"
error_playground_panic_spawned: "Panic spawned — check logs"
error_playground_http_title: "HTTP Error"
error_playground_http_description: "Sends an HTTP request to an invalid URL (127.0.0.1:1). Should NOT trigger the error boundary — the error is shown inline."
