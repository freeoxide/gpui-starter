query_playground_infinite_query_description: "Bidirectional pagination (max 3 pages kept). Data is pages 0..=10; Load Next goes toward 10, Load Previous toward 0. Either is disabled only at its end of the range."
query_playground_select_transform_title: "Select Transform"
