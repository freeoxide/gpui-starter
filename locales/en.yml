query_playground_title: "Query V2 Playground"
query_playground_intro: "Interactive demo of every gpui-query-v2 feature: queries, cache policies, request policies, retry, mutations, infinite queries, select transforms, and imperative fetch with signal cancellation."
query_playground_mutation_variables_placeholder: "Enter mutation variables..."
query_playground_simple_title: "Simple Query"
query_playground_simple_description: "Basic fetch with NoCache + LatestWins. Simulates 1s async work."
query_playground_cache_policies_title: "Cache Policies"
query_playground_cache_policies_description: "Compare NoCache, TTL 5s, and StaleWhileRevalidate 3s/7s."
query_playground_request_policies_title: "Request Policies"
query_playground_request_policies_description: "LatestWins: last fetch wins, older results discarded. IgnoreWhileLoading: first fetch completes, rest ignored."
query_playground_retry_policy_title: "Retry Policy"
query_playground_retry_policy_description: "Fetcher always fails. The RetryPolicy retries 3× with backoff before giving up — the button stays \"Retrying…\" through all attempts (that delay IS the retries happening), then ends in Failure."
