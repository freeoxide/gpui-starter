query_playground_request_policies_title: "Request Policies"
query_playground_request_policies_description: "LatestWins: last fetch wins, older results discarded. IgnoreWhileLoading: first fetch completes, rest ignored."
query_playground_retry_policy_title: "Retry Policy"
