[workspace]
members = [
	".",
]

[workspace.dependencies]
# gpui-form: git-sourced from the CANONICAL upstream stayhydated/gpui-form
# (NOT vendored in-tree; crates.io still ships only the old 0.5.1
# architecture). master @216af496 ("fix gpui-kit 0.6.0 CI", CI-green
# 2026-09-07) is kit-0.6.0-native — its gpui resolves through the registry to
# gpui-pre, unified with ours; its own [patch] section is IGNORED downstream.
# The two consumed crates point at the SAME rev so cargo resolves them from
# one checkout (internal crates come along transitively). The freeoxide fork
# @2604a5e (0.5.2 zed-git line) stays frozen as the Phase-1 rollback path.
gpui-form = { git = "https://github.com/stayhydated/gpui-form", rev = "216af496b2551d1b7be83b12e519cd0c908c28ff" }
gpui-form-collection = { git = "https://github.com/stayhydated/gpui-form", rev = "216af496b2551d1b7be83b12e519cd0c908c28ff" }

# GPUI ecosystem — crates.io `gpui-pre` is the published snapshot of zed gpui
# (PACKAGE name gpui-pre, lib name stays `gpui`); gpui-kit 0.6.4 builds on it.
# gpui-kit is listed directly because gpui-form's derives emit ::gpui_kit::
# paths into consuming crates; gpui-kit-assets replaces gpui-component-assets
# (the old longbridge/gpui-component git URL is retired with the zed patches).
# Never add a direct `accesskit` dep: gpui re-exports its own accesskit
# (`gpui::accesskit`, 0.24.x) and a separately-versioned accesskit is
# type-incompatible with the bridge.
gpui = { package = "gpui-pre", version = "0.3.5" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.5", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-kit = "0.6.4"
gpui-component = "0.6.4"
gpui-kit-assets = "0.6.4"

# Serialization & data
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
strum = { version = "0.28", features = ["derive"] }

# Async runtime. Base feature set only — it must compile on
# wasm32-unknown-unknown; the native-only `net`/`io-util` features are
# re-added under [target.'cfg(not(target_family = "wasm"))'.dependencies].
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Logging & telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
], default-features = false }

# i18n
rust-i18n = "3"
regex = "1"
# stayhydated es-fluent 0.18.1 family (upstream master pins this exact rev;
# crates.io maxes at an older line). All four from ONE checkout so our
# directly-used satellites stay in lockstep with the runtime gpui-form uses.
es-fluent = { git = "https://github.com/stayhydated/es-fluent", rev = "94efb551ede72c9e7da4bbdf97d5eecb5ea09982", features = ["derive"] }
es-fluent-build = { git = "https://github.com/stayhydated/es-fluent", rev = "94efb551ede72c9e7da4bbdf97d5eecb5ea09982" }
es-fluent-lang = { git = "https://github.com/stayhydated/es-fluent", rev = "94efb551ede72c9e7da4bbdf97d5eecb5ea09982" }
es-fluent-manager-embedded = { git = "https://github.com/stayhydated/es-fluent", rev = "94efb551ede72c9e7da4bbdf97d5eecb5ea09982" }

# Validation
# stayhydated koruma 0.11.0 family (crates.io maxes at 0.10; gpui-form
# @216af496 consumes 0.11 from this exact rev). All three from ONE checkout.
koruma = { git = "https://github.com/stayhydated/koruma", rev = "2ff495d8dc04794f0bcb2eb3c1a4a3c28e55a274", features = ["fluent"] }
koruma-collection = { git = "https://github.com/stayhydated/koruma", rev = "2ff495d8dc04794f0bcb2eb3c1a4a3c28e55a274", features = ["full-fluent"] }
koruma-derive-core = { git = "https://github.com/stayhydated/koruma", rev = "2ff495d8dc04794f0bcb2eb3c1a4a3c28e55a274" }

# Proc-macro infrastructure
darling = "0.23"
derive_more = { version = "2.1", features = ["full"] }
proc-macro-crate = "3.2"
proc-macro-error2 = "2.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
syn-cfg-attr = "0.1"
prettyplease = "0.2"

# Form generation deps
bon = "3.9"
heck = "0.5.0"
inventory = "0.3"
itertools = "0.14"

# ICU / date / time
icu_calendar = "2.2.0"
icu_datetime = "2.2.0"
icu_locale_core = "2.2.0"
jiff = "0.2.23"
unic-langid = "0.9"

# Testing
insta = { version = "1", features = ["yaml"] }

[package]
name = "gpui-starter"
version = "0.2.1"
edition = "2024"
publish = false
description = "A full-featured desktop application boilerplate built with GPUI (Zed's UI toolkit)"
repository = "https://github.com/freeoxide/gpui-starter"

[lib]
# rlib: consumed by the bin and by `cargo test -p gpui-starter --lib`;
# cdylib: the wasm32-unknown-unknown web artifact post-processed by
# wasm-bindgen for the browser harness.
crate-type = ["rlib", "cdylib"]

[features]
# Enable OTLP export over HTTP/Protobuf for the telemetry module.
# See src/telemetry.rs for the full list of optional dependencies this pulls in.
otlp = ["dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]
websocket = ["dep:tokio-tungstenite"]
# AI chat streaming page (default OFF). flume is unconditional
# (services/streaming.rs needs it regardless), so this is an empty gate
# that only controls the ai_chat feature-page module.
ai-chat = []
# XDG Desktop Portal notification backend for Flatpak/Snap/sandboxed runs
# (default OFF). When ON and running sandboxed, notifications route through
# org.freedesktop.portal.Notification via ashpd (reuses the transitive 0.13.x
# already compiled via gpui_linux/oo7). Native installs never need this.
notifications-portal = ["dep:ashpd"]

[dependencies]
gpui.workspace = true
# Version is a range (not `^0.1.4`) so the git override in [patch.crates-io]
# (branch gpui-pre-0.6 = v0.2.1 wasm support + release-profile fix + gpui-pre swap)
# actually satisfies this requirement and is applied. With a strict
# `^0.1.4`-only pin Cargo can silently drop a future patch as
# `[[patch.unused]]` and build the registry version regardless.
gpui-query = { version = ">=0.1.4, <0.3.0", features = ["hook"] }
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-kit.workspace = true
gpui-kit-assets.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
rust-i18n.workspace = true
regex.workspace = true
koruma.workspace = true
koruma-collection.workspace = true
es-fluent.workspace = true
es-fluent-lang.workspace = true
es-fluent-manager-embedded.workspace = true
strum.workspace = true
gpui-form.workspace = true
gpui-form-collection.workspace = true
# user-notify / notify-rust live in the not-wasm target section (D-Bus/mac
# notification frameworks have no wasm32-unknown-unknown story).
# Optional: XDG Desktop Portal notification backend (enable with --features notifications-portal).
# `notification` is required (ashpd gates its whole desktop::notification module behind it).
# `async-io` (NOT tokio) is required: notify-rust already forces zbus/async-io, and zbus forbids
# enabling both async-io and tokio. ashpd on async-io drives zbus's own background thread, so its
# futures are safe to await directly (like notify-rust's show_async).
ashpd = { version = "0.13", optional = true, default-features = false, features = ["notification", "async-io"] }
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
url = "2.5.8"
directories = "6.0.0"
atomic-write-file = "0.3.0"
semver = "1.0.28"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", optional = true, features = ["native-tls"] }
tempfile = "3.27.0"
reqwest = { version = "0.12.24", default-features = false, features = [
    "cookies",
    "json",
    "multipart",
    "rustls-tls",
    "stream",
] }
opentelemetry = "0.24.0"
# Optional: OTLP HTTP exporter for remote telemetry (enable with --features otlp)
opentelemetry-otlp = { version = "0.17.0", optional = true, features = [
    "http-proto",
    "reqwest-client",
] }
opentelemetry_sdk = { version = "0.24.1", optional = true, features = [
    "rt-tokio",
    "trace",
] }
rfd = "0.15.4"
notify = "8.2.0"
undo = "0.52.0"
sys-locale = "0.3"
flume = "0.11"
fuzzy-matcher = "0.3"
rust-embed = "8"

[dev-dependencies]
insta.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
global-hotkey = "0.8"
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
    "std",
    "NSBundle",
    "NSError",
    "NSString",
] }
objc2-user-notifications = { version = "0.3.0", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationSettings",
    "UNUserNotificationCenter",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native-only dependencies (no wasm32-unknown-unknown support: raw/local
# sockets, secret-service/keychain, C libsqlite3, D-Bus/mac notification
# frameworks). wasm32-unknown-unknown does not match cfg(unix), so the libc
# entry above is already wasm-excluded too. The source modules consuming
# these are cfg-fenced separately behind target_family = "wasm" stubs.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
single-instance = "0.3.3"
interprocess = "2.4.2"
network-interface = "2.0.3"
keyring = { version = "3.6.3", features = ["apple-native"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
notify-rust = "4.17.0"
user-notify = "0.4.2"
# `open` hits compile_error!("open is not supported on this platform") and
# `arboard` has no wasm clipboard backend (its `platform` module is
# linux/osx/windows only) — both hard-fail on wasm32-unknown-unknown
# (discovered during area 2's wasm check; same class as the dep gates above).
open = "5.3.2"
arboard = { version = "3.6.1", features = ["image-data"] }
# File appender uses symlink APIs with no wasm32-unknown-unknown story;
# wasm logs to the console (browser devtools) instead — see
# src/services/logging.rs.
tracing-appender = "0.2"
# Native-only tokio features re-added on top of the workspace base
# (rt + sync + time): `net` and `io-util` have no wasm implementation.
tokio = { workspace = true, features = ["io-util", "net"] }

# Web (wasm32-unknown-unknown) dependencies.
[target.'cfg(target_family = "wasm")'.dependencies]
# Exact pin: Cargo.lock carries wasm-bindgen 0.2.125 through the gpui web
# stack (gpui-pre-web), and the wasm-bindgen CLI version used by the web
# harness MUST match the crate version — keep both at 0.2.125.
wasm-bindgen = "=0.2.125"
# std::time::{Instant, SystemTime} COMPILE on wasm32-unknown-unknown but PANIC
# at runtime ("time not implemented on this platform"). The gpui web stack
# routes its clocks through web-time (browser performance.now()/Date); the app
# boot/render paths do the same via src/platform/clock.rs. Version = the one
# already locked through gpui-pre-web.
web-time = "1.1.0"
# chrono's default clock reads std SystemTime and has the same wasm runtime
# panic; the `wasmbind` feature swaps chrono::Utc::now() to js_sys::Date (both
# js-sys and wasm-bindgen are already locked). Feature union applies on wasm
# only — native keeps the default clock.
chrono = { version = "0.4", features = ["wasmbind"] }
# Browser API surface for the wasm integration bridges (src/platform/web/):
# clipboard (navigator.clipboard), hash deep links (location/history),
# favicon+title (canvas/link), and connectivity (online/offline events).
# Version-pinned to the pair already locked through the gpui web stack so the
# feature flags resolve against the SAME web-sys build (no duplicate compile).
# The feature set is the UNION of every wasm area's needs:
#   - B (this crate, browser integrations): Clipboard, Window, Navigator,
#     Location, History, Document, HtmlHeadElement, HtmlLinkElement,
#     HtmlCanvasElement, CanvasRenderingContext2d, Event, EventTarget,
#     AddEventListenerOptions
#   - C (web notifications): Notification, NotificationOptions,
#     NotificationDirection
#   - D (SQLite-on-OPFS worker): Worker, WorkerOptions, MessageEvent,
#     MessagePort, Storage, StorageManager, Blob, Url
# (Document/Html* transitively enable Element/Node; Window/Clipboard/Node
# transitively enable EventTarget.)
web-sys = { version = "=0.3.102", features = [
    "AddEventListenerOptions",
    "Blob",
    "CanvasRenderingContext2d",
    "Clipboard",
    "Document",
    "Event",
    "EventTarget",
    "History",
    "HtmlCanvasElement",
    "HtmlHeadElement",
    "HtmlLinkElement",
    "Location",
    "MessageEvent",
    "MessagePort",
    "Navigator",
    "Notification",
    "NotificationDirection",
    "NotificationOptions",
    "Storage",
    "StorageManager",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
] }
# Promise/Reflect/JsValue interop for the fire-and-forget clipboard write and
# the DOM event closures. Exact pin: matches the locked wasm-bindgen =0.2.125.
js-sys = "=0.3.102"

[build-dependencies]
es-fluent-build.workspace = true


[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

# Wasm release builds: thin LTO shrinks the (post-wasm-opt) binary noticeably
# at a modest link-time cost — the wasm release flow (`just wasm-release`) is
# the main consumer. Native release builds benefit equally.
[profile.release]
lto = "thin"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }

[patch.crates-io]
# gpui-query source toggle: `just gpui-query-local` / `just gpui-query-cratesio`.
# DEFAULT (git): hmziqagent/gpui-query branch `gpui-pre-0.6` @1449ef2 =
# v0.2.1 (wasm support, published) merged with the gpui-pre re-point; the
# workspace root pins `gpui = { package = "gpui-pre", version = "0.3" }` — no published or upstream version targets gpui-pre yet, so this
# patch carries the release fix AND re-points the crate onto registry gpui-pre
# (keeping the graph at ONE gpui). Drop this patch once upstream ships
# gpui-pre support on crates.io. The old 0.1.4-based fix (f84eac4) remains on
# branch fix/release-appcontext as the Phase-1 rollback pin. Keep exactly ONE
# line active — a duplicate gpui-query key is a TOML error.
# >>> gpui-query-local >>>
gpui-query = { git = "https://github.com/hmziqagent/gpui-query", rev = "1449ef2" }
# gpui-query = { path = "/Users/hmziq/fo/gpui-query/crates/gpui-query" }
# <<< gpui-query-local <<<
